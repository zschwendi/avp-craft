name: Build source
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: aarch64
      - run: python3 tools/audit.py
      - run: python3 tools/test_tools.py
      - run: python3 tools/build.py --version 0.1.0-dev
      - run: python3 tools/check_source.py
      - run: python3 tools/release.py --tag v0.1.0-dev
      - run: python3 tools/audit.py --pack dist/minecraft-metal-mac-v0.1.0-dev.mrpack
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-metal-mac-build
          path: dist/
